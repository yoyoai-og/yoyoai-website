<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | YOYOAI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #51df67;
            text-align: center;
            padding: 20px;
        }

        .thank-you-box {
            background: white;
            padding: 50px 35px;
            border-radius: 20px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .thank-you-box h1 {
            font-size: 42px;
            margin-bottom: 15px;
            color: #4f46e5;
        }

        .thank-you-box p {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .home-button {
            display: inline-block;
            padding: 14px 28px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .home-button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="thank-you-box">

        <h1>Thank You! 💚</h1>

        <p>
            Your message has been successfully sent to YOYOAI.
            We appreciate you getting in touch with us! 🚀
        </p>

        <a href="index.html" class="home-button">
            Back to YOYOAI 🏠
        </a>

    </div>

</body>
</html>
